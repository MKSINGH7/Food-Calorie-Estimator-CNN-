<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food Calories</title>
<style>
  :root { --bg:#f6f5f1; --card:#fff; --ink:#1d1d1b; --muted:#6b6a64; --acc:#2f7d4f; --line:#e3e1d9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161816; --card:#202320; --ink:#ecebe6; --muted:#9a9990; --acc:#6cc08b; --line:#333733; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  label { display:block; margin:12px 0 4px; font-size:.9rem; color:var(--muted); }
  input[type=number] { width:100%; padding:8px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; }
  .row { display:flex; gap:8px; align-items:center; margin-top:12px; font-size:.95rem; }
  button { margin-top:16px; width:100%; padding:12px; border:0; border-radius:8px; background:var(--acc); color:#fff; font-size:1rem; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  img#preview { max-width:100%; border-radius:8px; margin-top:12px; display:none; }
  #out { margin-top:16px; display:none; }
  .kcal { font-size:2.2rem; font-weight:700; color:var(--acc); }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--acc); }
  .alt { display:flex; justify-content:space-between; font-size:.9rem; margin-top:8px; }
  .alt .bar { flex:1; margin:8px 12px 0; }
  .err { color:#c0392b; }
</style>
</head>
<body>
<main>
  <h1>Food Calories</h1>
  <p class="sub">Upload a photo of a dish to estimate its calories.</p>
  <div class="card">
    <input type="file" id="file" accept="image/*">
    <img id="preview" alt="preview">
    <label for="grams">Portion in grams (optional, default = typical serving)</label>
    <input type="number" id="grams" min="1" placeholder="e.g. 250">
    <div class="row"><input type="checkbox" id="llm"><label for="llm" style="margin:0">Use LLM (advice + fallback when unsure)</label></div>
    <button id="go">Estimate calories</button>
    <div id="out"></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  $('preview').src = URL.createObjectURL(f); $('preview').style.display = 'block';
};
$('go').onclick = async () => {
  const f = $('file').files[0];
  const out = $('out'); out.style.display = 'block';
  if (!f) { out.innerHTML = '<span class="err">Choose an image first.</span>'; return; }
  const fd = new FormData();
  fd.append('file', f);
  if ($('grams').value) fd.append('grams', $('grams').value);
  fd.append('use_llm', $('llm').checked);
  $('go').disabled = true; out.textContent = 'Analysing…';
  try {
    const r = await fetch('/predict', { method: 'POST', body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.statusText);
    const name = (d.food || '?').replace(/_/g, ' ');
    let h = `<div class="kcal">${d.total_kcal ?? '?'} kcal</div>
             <div><b>${name}</b>${d.grams ? ` · ${d.grams} g` : ''}${d.serving ? ` (${d.serving})` : ''} · ${d.kcal_per_100g ?? '?'} kcal / 100 g</div>
             <div style="color:var(--muted);font-size:.85rem">source: ${d.source}</div>`;
    (d.top_k || []).forEach(t => {
      h += `<div class="alt"><span>${t.food.replace(/_/g,' ')}</span><div class="bar"><i style="width:${t.confidence*100}%"></i></div><span>${(t.confidence*100).toFixed(0)}%</span></div>`;
    });
    if (d.advice) h += `<p>${d.advice}</p>`;
    if (d.notes) h += `<p style="color:var(--muted);font-size:.85rem">${d.notes}</p>`;
    out.innerHTML = h;
  } catch (e) { out.innerHTML = `<span class="err">${e.message}</span>`; }
  $('go').disabled = false;
};
</script>
</body>
</html>
